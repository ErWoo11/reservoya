<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0a00">
  <title>Reservar — MesaYa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/reserva.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">🍽</span><span class="logo-text">MesaYa</span></a>
      <nav class="header-nav">
        <a href="index.html" class="nav-link">← Restaurantes</a>
        <a href="admin/login.html" class="nav-link btn-outline">Gestión</a>
      </nav>
    </div>
  </header>

  <div id="loadingPage" class="page-loading"><div class="spinner"></div><p>Cargando…</p></div>

  <div id="pageContent" style="display:none">
    <!-- Hero del restaurante -->
    <div class="restaurant-hero" id="restaurantHero">
      <div class="restaurant-hero-img">
        <img id="heroImg" src="" alt="">
        <div class="hero-overlay"></div>
      </div>
      <div class="restaurant-hero-info container">
        <div class="hero-badge" id="heroBadge"></div>
        <h1 id="heroName" class="hero-restaurant-name"></h1>
        <div class="hero-meta">
          <span id="heroLocation">📍</span>
          <span id="heroRating">⭐</span>
          <span id="heroPrice"></span>
          <span id="heroSchedule">🕐</span>
        </div>
      </div>
    </div>

    <div class="container reserva-layout">
      <!-- Info del restaurante -->
      <aside class="restaurant-info-panel">
        <div class="info-card">
          <h2 class="info-title">Sobre el restaurante</h2>
          <p id="restDesc" class="info-desc"></p>
          <div class="info-detail"><span class="info-icon">📞</span><span id="restPhone"></span></div>
          <div class="info-detail"><span class="info-icon">✉️</span><span id="restEmail"></span></div>
          <div class="info-detail"><span class="info-icon">📍</span><span id="restAddress"></span></div>
          <div class="info-detail"><span class="info-icon">🕐</span><span id="restSchedule"></span></div>
          <div class="info-detail"><span class="info-icon">👥</span><span id="restCapacity"></span></div>
        </div>
      </aside>

      <!-- Formulario de reserva -->
      <main class="booking-panel">
        <div class="booking-card">
          <div class="booking-steps">
            <div class="bstep active" data-step="1">
              <div class="bstep-num">1</div>
              <span>Fecha y hora</span>
            </div>
            <div class="bstep-line"></div>
            <div class="bstep" data-step="2">
              <div class="bstep-num">2</div>
              <span>Tus datos</span>
            </div>
            <div class="bstep-line"></div>
            <div class="bstep" data-step="3">
              <div class="bstep-num">3</div>
              <span>Confirmación</span>
            </div>
          </div>

          <!-- Step 1: Fecha, hora, personas -->
          <div id="step1" class="step-content">
            <h2 class="booking-title">Elige fecha y hora</h2>
            
            <div class="form-group">
              <label class="form-label">Número de comensales</label>
              <div class="guests-selector">
                <button type="button" class="guest-btn" id="guestsDown">−</button>
                <span id="guestsCount" class="guests-num">2</span>
                <button type="button" class="guest-btn" id="guestsUp">+</button>
                <span class="guests-label">personas</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Fecha de la reserva</label>
              <input type="date" id="bookingDate" class="form-input" min="">
            </div>

            <div class="form-group" id="timeSlotsGroup" style="display:none">
              <label class="form-label">Hora disponible</label>
              <div class="time-slots" id="timeSlots"></div>
            </div>

            <button class="btn-primary full-width" id="step1Next" disabled>
              Continuar →
            </button>
          </div>

          <!-- Step 2: Datos del cliente -->
          <div id="step2" class="step-content" style="display:none">
            <h2 class="booking-title">Tus datos</h2>
            
            <div class="booking-summary" id="bookingSummary"></div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Nombre *</label>
                <input type="text" id="clientName" class="form-input" placeholder="Tu nombre" required>
              </div>
              <div class="form-group">
                <label class="form-label">Apellidos *</label>
                <input type="text" id="clientLastname" class="form-input" placeholder="Apellidos" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" id="clientEmail" class="form-input" placeholder="email@ejemplo.com" required>
              </div>
              <div class="form-group">
                <label class="form-label">Teléfono *</label>
                <input type="tel" id="clientPhone" class="form-input" placeholder="+34 600 000 000" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Peticiones especiales</label>
              <textarea id="clientNotes" class="form-input form-textarea" placeholder="Alergias, ocasión especial, preferencia de mesa…" rows="3"></textarea>
            </div>
            <div class="form-check">
              <input type="checkbox" id="privacyCheck">
              <label for="privacyCheck">Acepto la <a href="#">política de privacidad</a> y el tratamiento de mis datos</label>
            </div>

            <div class="btn-row">
              <button class="btn-secondary" onclick="goStep(1)">← Atrás</button>
              <button class="btn-primary" id="step2Next">Confirmar reserva →</button>
            </div>
          </div>

          <!-- Step 3: Confirmación -->
          <div id="step3" class="step-content" style="display:none">
            <div class="confirmation-icon">✅</div>
            <h2 class="booking-title">¡Reserva confirmada!</h2>
            <p class="confirmation-text">Hemos enviado los detalles a tu email. Te esperamos.</p>
            
            <div class="confirmation-card" id="confirmCard"></div>
            
            <div class="btn-row centered">
              <button class="btn-secondary" onclick="window.print()">🖨 Imprimir</button>
              <a href="index.html" class="btn-primary">Volver al inicio</a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/reserva.js"></script>
</body>
</html>
