<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Gestión — MesaYa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="login-container">
    <div class="login-art">
      <div class="login-art-bg"></div>
      <div class="login-art-content">
        <div class="login-logo">🍽 MesaYa</div>
        <h2 class="login-art-title">Gestiona tus<br><em>reservas fácil</em></h2>
        <p>Panel de administración para bares y restaurantes. Controla tus mesas en tiempo real.</p>
      </div>
    </div>
    <div class="login-form-panel">
      <div class="login-form-inner">
        <h1 class="login-title">Acceder</h1>
        <p class="login-subtitle">Panel de gestión del restaurante</p>

        <div id="loginError" class="alert-error" style="display:none"></div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="tu@restaurante.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn-primary full-width" id="loginBtn">Entrar al panel →</button>

        <div class="login-divider"><span>o accede en modo demo</span></div>

        <button class="btn-demo" id="demoBtn">🎭 Demo sin Firebase</button>

        <p class="login-footer">
          ¿Quieres unirte? <a href="mailto:hola@mesaya.es">Contacta con nosotros</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, DEMO_MODE } from '../js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const loginBtn = document.getElementById('loginBtn');
    const demoBtn = document.getElementById('demoBtn');
    const errorEl = document.getElementById('loginError');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      if (!email || !pass) { showError('Completa email y contraseña'); return; }
      
      loginBtn.disabled = true; loginBtn.textContent = 'Accediendo…';
      errorEl.style.display = 'none';

      if (DEMO_MODE || !auth) {
        // Demo with fake credentials
        sessionStorage.setItem('mesaya_admin', JSON.stringify({ email, role: 'owner', restaurantId: 'rest1', demo: true }));
        location.href = 'dashboard.html';
        return;
      }
      
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        sessionStorage.setItem('mesaya_admin', JSON.stringify({ uid: cred.user.uid, email }));
        location.href = 'dashboard.html';
      } catch(e) {
        const msg = e.code === 'auth/invalid-credential' ? 'Email o contraseña incorrectos' : 'Error al acceder. Inténtalo de nuevo.';
        showError(msg);
        loginBtn.disabled = false; loginBtn.textContent = 'Entrar al panel →';
      }
    });

    demoBtn.addEventListener('click', () => {
      sessionStorage.setItem('mesaya_admin', JSON.stringify({ email: 'demo@mesaya.es', role: 'owner', restaurantId: 'rest1', demo: true }));
      location.href = 'dashboard.html';
    });

    // Enter key
    document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') loginBtn.click(); });

    // Already logged in?
    if (sessionStorage.getItem('mesaya_admin')) location.href = 'dashboard.html';
  </script>
</body>
</html>
