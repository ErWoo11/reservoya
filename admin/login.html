<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Gestión — MesaYa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="login-container">
    <div class="login-art">
      <div class="login-art-bg"></div>
      <div class="login-art-content">
        <div class="login-logo">🍽 MesaYa</div>
        <h2 class="login-art-title">Gestiona tus<br><em>reservas fácil</em></h2>
        <p>Panel de administración para bares y restaurantes. Controla tus mesas en tiempo real.</p>
      </div>
    </div>
    <div class="login-form-panel">
      <div class="login-form-inner">
        <h1 class="login-title">Acceder</h1>
        <p class="login-subtitle">Panel de gestión del restaurante</p>

        <div id="loginError" class="alert-error" style="display:none"></div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="tu@restaurante.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn-primary full-width" id="loginBtn">Entrar al panel →</button>

        <p class="login-footer">
          ¿Quieres unirte? <a href="mailto:hola@mesaya.es">Contacta con nosotros</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '../js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Si ya está logado, redirigir
    if (sessionStorage.getItem('mesaya_admin')) location.href = 'dashboard.html';

    const loginBtn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      if (!email || !pass) { showError('Completa email y contraseña'); return; }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Accediendo…';
      errorEl.style.display = 'none';

      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const uid = cred.user.uid;

        // Buscar el restaurante asociado al usuario en Firestore
        const q = query(collection(db, 'restaurants'), where('ownerUid', '==', uid));
        const snap = await getDocs(q);

        if (snap.empty) {
          showError('No se encontró un restaurante asociado a este usuario.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Entrar al panel →';
          return;
        }

        const restaurantDoc = snap.docs[0];
        sessionStorage.setItem('mesaya_admin', JSON.stringify({
          uid,
          email,
          restaurantId: restaurantDoc.id
        }));
        location.href = 'dashboard.html';
      } catch(e) {
        console.error(e);
        const msgs = {
          'auth/invalid-credential': 'Email o contraseña incorrectos',
          'auth/user-not-found': 'Usuario no encontrado',
          'auth/wrong-password': 'Contraseña incorrecta',
          'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.'
        };
        showError(msgs[e.code] || 'Error al acceder. Inténtalo de nuevo.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Entrar al panel →';
      }
    });

    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') loginBtn.click();
    });
  </script>
</body>
</html>
